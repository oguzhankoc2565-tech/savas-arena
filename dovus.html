<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stick Dövüş</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;font-family:Arial,sans-serif;color:#fff;padding:10px;}
    h1{color:#ff4444;font-size:24px;margin-bottom:8px;text-shadow:0 0 10px #ff4444;}
    #bilgi{display:flex;gap:40px;margin-bottom:8px;font-size:15px;font-weight:bold;}
    canvas{border:3px solid #ff4444;border-radius:8px;}
    #mesaj{margin-top:8px;font-size:13px;color:#888;text-align:center;}
    #kontroller{display:flex;gap:40px;margin-top:10px;font-size:12px;color:#666;}
    .kontrol-grup{text-align:center;}
    .kontrol-grup h3{color:#aaa;margin-bottom:4px;font-size:13px;}
    .kontrol-grup p{margin:2px 0;}
    #yenidenBtn{display:none;margin-top:12px;padding:10px 28px;background:#ff4444;color:#fff;border:none;border-radius:20px;font-size:15px;font-weight:bold;cursor:pointer;}
    #geriBtn{margin-top:8px;padding:5px 18px;background:transparent;color:#888;border:1px solid #333;border-radius:14px;font-size:12px;cursor:pointer;}
    #modSecim{display:flex;gap:12px;margin-bottom:10px;}
    .mod-btn{padding:8px 20px;border:2px solid #444;border-radius:16px;background:#1a1a1a;color:#fff;font-size:13px;cursor:pointer;transition:all 0.2s;}
    .mod-btn.aktif{border-color:#ff4444;background:#ff444422;color:#ff4444;}
  </style>
</head>
<body>

<h1>🥊 STİCK DÖVÜŞ</h1>

<div id="modSecim">
  <button class="mod-btn aktif" id="btn2kisi" onclick="modSec('2kisi')">👥 2 Kişi (Aynı Klavye)</button>
  <button class="mod-btn" id="btnMPC" onclick="modSec('mpc')">🤖 MPC (Yapay Zeka)</button>
</div>

<div id="bilgi">
  <span style="color:#4488ff">🔵 <span id="can1">5</span> ❤️</span>
  <span style="color:#fff">VS</span>
  <span style="color:#ff4444">❤️ <span id="can2">5</span> 🔴</span>
</div>

<canvas id="oyun" width="800" height="400"></canvas>

<div id="mesaj">Hazır olunca başla!</div>
<button id="yenidenBtn" onclick="baslat()">🔄 Yeniden Oyna</button>
<button id="geriBtn" onclick="window.location.href='index.html'">← Ana Sayfa</button>

<div id="kontroller">
  <div class="kontrol-grup">
    <h3>🔵 Oyuncu 1</h3>
    <p>A/D → Hareket</p>
    <p>W → Zıpla</p>
    <p>F → Yumruk</p>
    <p>G → Tekme</p>
    <p>T → Özel Saldırı</p>
  </div>
  <div class="kontrol-grup">
    <h3>🔴 Oyuncu 2 / MPC</h3>
    <p>← → Hareket</p>
    <p>↑ → Zıpla</p>
    <p>K → Yumruk</p>
    <p>L → Tekme</p>
    <p>P → Özel Saldırı</p>
  </div>
</div>

<script>
const canvas=document.getElementById('oyun');
const ctx=canvas.getContext('2d');
const W=800,H=400,ZEMIN=H-60,G=0.6;

let mod='2kisi';
let o1,o2,efektler,oyunBitti,frameNo,tuslar={};

function modSec(m){
  mod=m;
  ['2kisi','mpc'].forEach(x=>{
    document.getElementById('btn'+( x==='2kisi'?'2kisi':'MPC')).classList.toggle('aktif',x===m);
  });
  baslat();
}

function oyuncuOlustur(x,yon,renk,emoji){
  return {
    x,y:ZEMIN-70,vy:0,yerde:true,
    w:40,h:70,hiz:5,yon,
    can:5,canMax:5,
    renk,emoji,
    saldiriZamani:0,
    ozelZamani:0,
    saldiridaMi:false,
    savunmada:false,
    sarsinti:0,
    combo:0,
    ozelDolu:0
  };
}

function baslat(){
  o1=oyuncuOlustur(150,1,'#4488ff','🔵');
  o2=oyuncuOlustur(600,-1,'#ff4444','🔴');
  efektler=[];oyunBitti=false;frameNo=0;
  document.getElementById('yenidenBtn').style.display='none';
  document.getElementById('mesaj').textContent=mod==='2kisi'?'2 Kişilik Mod — Savaş Başlasın!':'MPC Modu — Yapay Zekaya Karşı Savaş!';
  guncelleCan();
  requestAnimationFrame(dongu);
}

function guncelleCan(){
  document.getElementById('can1').textContent=o1.can;
  document.getElementById('can2').textContent=o2.can;
}

document.addEventListener('keydown',e=>{
  tuslar[e.code]=true;
  if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();

  // O1 saldırı
  if(e.code==='KeyF')saldir(o1,o2,'yumruk');
  if(e.code==='KeyG')saldir(o1,o2,'tekme');
  if(e.code==='KeyT')ozelSaldir(o1,o2);

  // O2 saldırı (sadece 2kisi modunda)
  if(mod==='2kisi'){
    if(e.code==='KeyK')saldir(o2,o1,'yumruk');
    if(e.code==='KeyL')saldir(o2,o1,'tekme');
    if(e.code==='KeyP')ozelSaldir(o2,o1);
  }
});
document.addEventListener('keyup',e=>tuslar[e.code]=false);

function saldir(saldiran,hedef,tip){
  if(frameNo-saldiran.saldiriZamani<20)return;
  saldiran.saldiriZamani=frameNo;
  saldiran.saldiridaMi=true;
  setTimeout(()=>saldiran.saldiridaMi=false,300);

  let mesafe=Math.abs((saldiran.x+saldiran.w/2)-(hedef.x+hedef.w/2));
  if(mesafe<100){
    let hasar=tip==='yumruk'?1:2;
    if(hedef.savunmada)hasar=Math.max(0,hasar-1);
    hedef.can=Math.max(0,hedef.can-hasar);
    hedef.sarsinti=tip==='tekme'?20:10;
    saldiran.combo++;
    saldiran.ozelDolu=Math.min(100,saldiran.ozelDolu+15);
    efektler.push({
      x:hedef.x+hedef.w/2,y:hedef.y+20,
      txt:tip==='yumruk'?'POW!':'KICK!',
      renk:tip==='yumruk'?'#ffdd00':'#ff8800',
      bekleme:40,vy:-1.5
    });
    guncelleCan();
    if(hedef.can<=0)bitis(saldiran);
  }
}

function ozelSaldir(saldiran,hedef){
  if(saldiran.ozelDolu<100)return;
  if(frameNo-saldiran.ozelZamani<60)return;
  saldiran.ozelZamani=frameNo;
  saldiran.ozelDolu=0;

  let mesafe=Math.abs((saldiran.x+saldiran.w/2)-(hedef.x+hedef.w/2));
  if(mesafe<150){
    hedef.can=Math.max(0,hedef.can-3);
    hedef.sarsinti=40;
    efektler.push({
      x:hedef.x+hedef.w/2,y:hedef.y,
      txt:'ULTRA!!!',renk:'#ff00ff',
      bekleme:60,vy:-2
    });
    guncelleCan();
    if(hedef.can<=0)bitis(saldiran);
  }
  // Patlama efekti
  for(let i=0;i<8;i++){
    efektler.push({
      x:saldiran.x+saldiran.w/2,
      y:saldiran.y+saldiran.h/2,
      txt:'★',renk:'#ff00ff',
      bekleme:30,
      vx:Math.cos(i*Math.PI/4)*4,
      vy:Math.sin(i*Math.PI/4)*4-2
    });
  }
}

function mpcHareket(){
  let mesafe=(o2.x+o2.w/2)-(o1.x+o1.w/2);
  let uzaklik=Math.abs(mesafe);

  // Yaklaş veya uzaklaş
  if(uzaklik>120){
    o2.x+=mesafe>0?-o2.hiz*0.8:o2.hiz*0.8;
    o2.yon=mesafe>0?-1:1;
  } else if(uzaklik<60){
    o2.x+=mesafe>0?o2.hiz*0.5:-o2.hiz*0.5;
  }

  // Saldır
  if(uzaklik<100&&frameNo%25===0){
    let tip=Math.random()<0.6?'yumruk':'tekme';
    saldir(o2,o1,tip);
  }

  // Özel saldırı
  if(o2.ozelDolu>=100&&uzaklik<150&&frameNo%80===0){
    ozelSaldir(o2,o1);
  }

  // Zıpla
  if(o2.yerde&&Math.random()<0.008){
    o2.vy=-13;o2.yerde=false;
  }

  // Savunma
  o2.savunmada=uzaklik<80&&Math.random()<0.3;
}

function dongu(){
  if(oyunBitti)return;
  frameNo++;
  guncelleFizik();
  ciz();
  requestAnimationFrame(dongu);
}

function guncelleFizik(){
  // O1 hareket
  if(tuslar['KeyA']){o1.x-=o1.hiz;o1.yon=-1;}
  if(tuslar['KeyD']){o1.x+=o1.hiz;o1.yon=1;}
  if((tuslar['KeyW'])&&o1.yerde){o1.vy=-13;o1.yerde=false;}
  o1.savunmada=tuslar['KeyS']||false;

  // O2 hareket (2kisi modunda)
  if(mod==='2kisi'){
    if(tuslar['ArrowLeft']){o2.x-=o2.hiz;o2.yon=-1;}
    if(tuslar['ArrowRight']){o2.x+=o2.hiz;o2.yon=1;}
    if(tuslar['ArrowUp']&&o2.yerde){o2.vy=-13;o2.yerde=false;}
    o2.savunmada=tuslar['ArrowDown']||false;
  } else {
    mpcHareket();
  }

  // Fizik
  [o1,o2].forEach(o=>{
    o.vy+=G;o.y+=o.vy;
    if(o.y>=ZEMIN-o.h){o.y=ZEMIN-o.h;o.vy=0;o.yerde=true;}
    o.x=Math.max(0,Math.min(W-o.w,o.x));
    if(o.sarsinti>0){o.x+=o.sarsinti>0?2:-2;o.sarsinti--;}
    o.ozelDolu=Math.min(100,o.ozelDolu+0.1);
  });

  // Yön güncelle
  if(o1.x<o2.x)o1.yon=1; else o1.yon=-1;
  if(mod==='2kisi'){if(o2.x<o1.x)o2.yon=1; else o2.yon=-1;}

  // Efektler
  efektler=efektler.filter(e=>e.bekleme>0);
  efektler.forEach(e=>{
    e.bekleme--;
    e.y+=e.vy||0;
    e.x+=(e.vx||0);
  });
}

function cizOyuncu(o,numara){
  // Gölge
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(o.x+o.w/2,ZEMIN,o.w/2,6,0,0,Math.PI*2);
  ctx.fill();

  // Savunma kalkanı
  if(o.savunmada){
    ctx.fillStyle='rgba(100,200,255,0.2)';
    ctx.beginPath();
    ctx.arc(o.x+o.w/2,o.y+o.h/2,o.w,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(100,200,255,0.6)';
    ctx.lineWidth=2;
    ctx.stroke();
  }

  // Karakter
  ctx.font='48px Arial';
  ctx.textAlign='center';
  ctx.fillText(o.emoji,o.x+o.w/2,o.y+o.h);

  // Saldırı efekti
  if(o.saldiridaMi){
    ctx.font='24px Arial';
    ctx.fillText(o.yon>0?'👊':'👊',o.x+o.w/2+o.yon*30,o.y+30);
  }

  // Can barı
  let bx=o.x,by=o.y-20,bw=o.w;
  ctx.fillStyle='#333';
  ctx.fillRect(bx,by,bw,8);
  ctx.fillStyle=o.can>2?'#00ff44':o.can>1?'#ffaa00':'#ff2200';
  ctx.fillRect(bx,by,bw*(o.can/o.canMax),8);
  ctx.strokeStyle='#555';
  ctx.lineWidth=1;
  ctx.strokeRect(bx,by,bw,8);

  // Özel güç barı
  ctx.fillStyle='#222';
  ctx.fillRect(bx,by+10,bw,4);
  ctx.fillStyle='#ff00ff';
  ctx.fillRect(bx,by+10,bw*(o.ozelDolu/100),4);

  // İsim
  ctx.fillStyle=o.renk;
  ctx.font='bold 12px Arial';
  ctx.textAlign='center';
  ctx.fillText(numara===1?'P1':'P2',o.x+o.w/2,o.y-24);
}

function ciz(){
  // Arkaplan
  let grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a0a2e');
  grad.addColorStop(1,'#0a0a1a');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Arena çizgileri
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  ctx.lineWidth=1;
  for(let i=0;i<W;i+=60){
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();
  }

  // Platform
  ctx.fillStyle='#2a1a3a';
  ctx.fillRect(0,ZEMIN,W,H-ZEMIN);
  ctx.fillStyle='#4a2a6a';
  ctx.fillRect(0,ZEMIN,W,6);

  // Dekor platformlar
  ctx.fillStyle='#3a2a5a';
  ctx.fillRect(150,ZEMIN-80,120,15);
  ctx.fillRect(530,ZEMIN-80,120,15);
  ctx.fillRect(330,ZEMIN-130,140,15);

  // Oyuncular
  cizOyuncu(o1,1);
  cizOyuncu(o2,2);

  // Efektler
  efektler.forEach(e=>{
    ctx.fillStyle=e.renk;
    ctx.font='bold 18px Arial';
    ctx.textAlign='center';
    ctx.globalAlpha=e.bekleme/40;
    ctx.fillText(e.txt,e.x,e.y);
    ctx.globalAlpha=1;
  });

  // Özel güç hazır uyarısı
  if(o1.ozelDolu>=100){
    ctx.fillStyle='#ff00ff';
    ctx.font='bold 13px Arial';
    ctx.textAlign='left';
    ctx.fillText('⚡ ÖZEL HAZIR! (T)',10,30);
  }
  if(o2.ozelDolu>=100&&mod==='2kisi'){
    ctx.fillStyle='#ff00ff';
    ctx.font='bold 13px Arial';
    ctx.textAlign='right';
    ctx.fillText('(P) ÖZEL HAZIR! ⚡',W-10,30);
  }
}

function bitis(kazanan){
  oyunBitti=true;
  ctx.fillStyle='rgba(0,0,0,0.75)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle=kazanan.renk;
  ctx.font='bold 48px Arial';
  ctx.textAlign='center';
  ctx.fillText(kazanan===o1?'🔵 OYUNCU 1':'🔴 OYUNCU 2',W/2,H/2-30);
  ctx.fillStyle='#fff';
  ctx.font='32px Arial';
  ctx.fillText('KAZANDI! 🏆',W/2,H/2+20);
  document.getElementById('yenidenBtn').style.display='inline-block';
}

baslat();
</script>
</body>
</html>
