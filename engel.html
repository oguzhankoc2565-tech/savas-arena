<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engel Koşusu</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;font-family:Arial,sans-serif;color:#fff;padding:10px;}
    h1{color:#ffaa00;font-size:24px;margin-bottom:8px;text-shadow:0 0 10px #ffaa00;}
    #bilgi{display:flex;gap:30px;margin-bottom:8px;font-size:14px;font-weight:bold;flex-wrap:wrap;justify-content:center;}
    canvas{border:3px solid #ffaa00;border-radius:8px;}
    #mesaj{margin-top:8px;font-size:13px;color:#888;text-align:center;}
    #modSecim{display:flex;gap:12px;margin-bottom:10px;}
    .mod-btn{padding:8px 20px;border:2px solid #444;border-radius:16px;background:#1a1a1a;color:#fff;font-size:13px;cursor:pointer;}
    .mod-btn.aktif{border-color:#ffaa00;background:#ffaa0022;color:#ffaa00;}
    #yenidenBtn{display:none;margin-top:12px;padding:10px 28px;background:#ffaa00;color:#000;border:none;border-radius:20px;font-size:15px;font-weight:bold;cursor:pointer;}
    #geriBtn{margin-top:8px;padding:5px 18px;background:transparent;color:#888;border:1px solid #333;border-radius:14px;font-size:12px;cursor:pointer;}
    #kontroller{display:flex;gap:40px;margin-top:10px;font-size:12px;color:#666;}
    .kontrol-grup{text-align:center;}
    .kontrol-grup h3{color:#aaa;margin-bottom:4px;font-size:13px;}
  </style>
</head>
<body>

<h1>⚡ ENGEL KOŞUSU</h1>

<div id="modSecim">
  <button class="mod-btn aktif" id="btn1kisi" onclick="modSec('1kisi')">🏃 1 Kişi</button>
  <button class="mod-btn" id="btn2kisi" onclick="modSec('2kisi')">👥 2 Kişi</button>
</div>

<div id="bilgi">
  <span style="color:#4488ff">🔵 P1: <span id="skor1">0</span>m</span>
  <span id="skor2bilgi" style="color:#ff4444">🔴 P2: <span id="skor2">0</span>m</span>
  <span style="color:#ffaa00">⚡ Hız: <span id="hizEl">1.0</span>x</span>
  <span style="color:#ff4444">❤️ Can: <span id="canEl">3</span></span>
</div>

<canvas id="oyun" width="800" height="380"></canvas>
<div id="mesaj">Başlamak için hazır ol!</div>
<button id="yenidenBtn" onclick="baslat()">🔄 Yeniden Oyna</button>
<button id="geriBtn" onclick="window.location.href='index.html'">← Ana Sayfa</button>

<div id="kontroller">
  <div class="kontrol-grup">
    <h3>🔵 Oyuncu 1</h3>
    <p>W / Yukarı → Zıpla</p>
    <p>S / Aşağı → Eğil</p>
  </div>
  <div id="p2kontrol" class="kontrol-grup" style="display:none">
    <h3>🔴 Oyuncu 2</h3>
    <p>↑ → Zıpla</p>
    <p>↓ → Eğil</p>
  </div>
</div>

<script>
const canvas=document.getElementById('oyun');
const ctx=canvas.getContext('2d');
const W=800,H=380;
const ZEMIN1=H-80,ZEMIN2=H-40;

let mod='1kisi';
let oyuncular,engeller,arkaplan,hiz,mesafe,can,oyunBitti,frameNo,tuslar={};

function modSec(m){
  mod=m;
  document.getElementById('btn1kisi').classList.toggle('aktif',m==='1kisi');
  document.getElementById('btn2kisi').classList.toggle('aktif',m==='2kisi');
  document.getElementById('skor2bilgi').style.display=m==='2kisi'?'':'none';
  document.getElementById('p2kontrol').style.display=m==='2kisi'?'':'none';
  baslat();
}

function oyuncuOlustur(x,zemin,renk,emoji){
  return {
    x,y:zemin-50,vy:0,yerde:true,
    w:36,h:50,zemin,
    renk,emoji,
    egil:false,oldu:false,
    skor:0,canTitreme:0,
    zipSayisi:0
  };
}

function baslat(){
  let z1=mod==='2kisi'?ZEMIN1:ZEMIN2-20;
  oyuncular=[oyuncuOlustur(120,z1,'#4488ff','🏃')];
  if(mod==='2kisi') oyuncular.push(oyuncuOlustur(160,ZEMIN2,'#ff4444','🏃'));
  engeller=[];arkaplan=[];
  hiz=4;mesafe=0;can=3;oyunBitti=false;frameNo=0;
  document.getElementById('yenidenBtn').style.display='none';
  document.getElementById('mesaj').textContent=mod==='2kisi'?'W/S: P1 | ↑↓: P2':'W veya Yukarı: Zıpla | S: Eğil';
  document.getElementById('canEl').textContent=can;
  arkaplanOlustur();
  if(frameNo) cancelAnimationFrame(frameNo);
  requestAnimationFrame(dongu);
}

function arkaplanOlustur(){
  for(let i=0;i<20;i++){
    arkaplan.push({x:Math.random()*W,y:Math.random()*(H-100),w:Math.random()*60+20,h:Math.random()*40+10,tip:Math.random()<0.5?'bina':'bulut'});
  }
}

document.addEventListener('keydown',e=>{
  tuslar[e.code]=true;
  if(['ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  // P1 zıpla
  if((e.code==='KeyW'||e.code==='ArrowUp')&&!oyunBitti){
    let o=oyuncular[0];
    if(o.yerde){o.vy=-14;o.yerde=false;o.zipSayisi=1;}
    else if(o.zipSayisi<2){o.vy=-12;o.zipSayisi=2;}
  }
  // P2 zıpla
  if(mod==='2kisi'&&oyuncular[1]){
    let o=oyuncular[1];
    if(e.code==='Numpad8'||e.code==='ArrowUp'){
      if(o.yerde){o.vy=-14;o.yerde=false;o.zipSayisi=1;}
      else if(o.zipSayisi<2){o.vy=-12;o.zipSayisi=2;}
    }
  }
});
document.addEventListener('keyup',e=>tuslar[e.code]=false);

function engelUret(){
  if(frameNo%Math.floor(80/hiz*4)!==0)return;
  let tip=Math.random();
  let y=oyuncular[0].zemin;

  if(tip<0.25){
    // Düşük engel
    engeller.push({x:W+20,y:y-40,w:24,h:40,tip:'engel',renk:'#ff4444',emoji:'🌵'});
  } else if(tip<0.45){
    // Yüksek engel (eğilmek lazım)
    engeller.push({x:W+20,y:y-80,w:60,h:30,tip:'ucur',renk:'#ff8800',emoji:'⚡',yuksek:true});
  } else if(tip<0.60){
    // Uçurum
    engeller.push({x:W+20,y:y+2,w:80,h:20,tip:'ucurum',renk:'#000',emoji:'',delik:true});
  } else if(tip<0.75){
    // Düşman
    engeller.push({x:W+20,y:y-44,w:36,h:44,tip:'dusman',renk:'#aa00ff',emoji:'👾',vx:-0.5});
  } else if(tip<0.88){
    // Çift engel
    engeller.push({x:W+20,y:y-40,w:24,h:40,tip:'engel',renk:'#ff4444',emoji:'🌵'});
    engeller.push({x:W+100,y:y-40,w:24,h:40,tip:'engel',renk:'#ff4444',emoji:'🌵'});
  } else {
    // Platform (üstüne zıplanabilir)
    engeller.push({x:W+20,y:y-100,w:80,h:16,tip:'platform',renk:'#00aa44',emoji:''});
  }
}

function dongu(){
  if(oyunBitti)return;
  frameNo++;
  guncelleFizik();
  ciz();
  requestAnimationFrame(dongu);
}

function guncelleFizik(){
  // Hız artışı
  hiz=4+mesafe/800;
  mesafe+=hiz*0.1;
  document.getElementById('hizEl').textContent=hiz.toFixed(1);

  // Oyuncular
  oyuncular.forEach((o,i)=>{
    if(o.oldu)return;
    o.egil=(i===0&&(tuslar['KeyS']||tuslar['ArrowDown']))||(i===1&&tuslar['ArrowDown']);
    let gh=o.egil?0.8:1;
    o.h=o.egil?28:50;

    o.vy+=0.7;
    o.y+=o.vy;
    if(o.y>=o.zemin-o.h){
      o.y=o.zemin-o.h;
      o.vy=0;
      o.yerde=true;
      o.zipSayisi=0;
    }

    o.skor=Math.floor(mesafe);
    if(i===0) document.getElementById('skor1').textContent=o.skor;
    else document.getElementById('skor2').textContent=o.skor;
    if(o.canTitreme>0)o.canTitreme--;
  });

  // Engeller
  engelUret();
  engeller=engeller.filter(e=>e.x>-100);
  engeller.forEach(e=>{
    e.x-=hiz;
    if(e.vx)e.x+=e.vx;

    // Çarpışma
    oyuncular.forEach((o,oi)=>{
      if(o.oldu||o.canTitreme>0)return;
      let ox=o.x,oy=o.y,ow=o.w,oh=o.h;

      if(e.tip==='ucurum'){
        // Uçuruma düştü mü?
        if(ox+ow>e.x&&ox<e.x+e.w&&o.yerde){
          hasar(o);
        }
        return;
      }

      if(e.tip==='platform'){
        // Platform üstüne zıplama
        if(ox+ow>e.x&&ox<e.x+e.w&&oy+oh>e.y&&oy+oh<e.y+e.h+10&&o.vy>0){
          o.y=e.y-oh;o.vy=0;o.yerde=true;o.zipSayisi=0;
        }
        return;
      }

      if(e.tip==='ucur'){
        // Eğilmezse çarpar
        if(!o.egil&&ox+ow>e.x+4&&ox<e.x+e.w-4&&oy<e.y+e.h&&oy+oh>e.y){
          hasar(o);
        }
        return;
      }

      // Normal çarpışma
      if(ox+ow>e.x+4&&ox<e.x+e.w-4&&oy+oh>e.y+4&&oy<e.y+e.h-4){
        hasar(o);
      }
    });
  });

  // Arkaplan kaydır
  arkaplan.forEach(a=>a.x-=hiz*0.3);
  arkaplan=arkaplan.filter(a=>a.x>-100);
  if(arkaplan.length<15){
    arkaplan.push({x:W+50,y:Math.random()*(H-120),w:Math.random()*60+20,h:Math.random()*40+10,tip:Math.random()<0.5?'bina':'bulut'});
  }
}

function hasar(o){
  can--;
  o.canTitreme=60;
  document.getElementById('canEl').textContent=Math.max(0,can);
  if(can<=0)bitis();
}

function ciz(){
  // Gökyüzü
  ctx.fillStyle='#1a1a3a';
  ctx.fillRect(0,0,W,H);

  // Arkaplan
  arkaplan.forEach(a=>{
    if(a.tip==='bulut'){
      ctx.fillStyle='rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.ellipse(a.x+a.w/2,a.y+a.h/2,a.w/2,a.h/2,0,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle='rgba(255,150,50,0.08)';
      ctx.fillRect(a.x,a.y,a.w,a.h);
    }
  });

  // Zemin
  let z=oyuncular[0].zemin;
  ctx.fillStyle='#2a1500';
  ctx.fillRect(0,z,W,H-z);
  ctx.fillStyle='#ffaa00';
  ctx.fillRect(0,z,W,4);

  if(mod==='2kisi'){
    ctx.fillStyle='#1a0a00';
    ctx.fillRect(0,ZEMIN2,W,H-ZEMIN2);
    ctx.fillStyle='#ff6600';
    ctx.fillRect(0,ZEMIN2,W,4);
  }

  // Engeller
  engeller.forEach(e=>{
    if(e.tip==='ucurum'){
      ctx.fillStyle='#000';
      ctx.fillRect(e.x,e.y,e.w,H-e.y);
      ctx.fillStyle='#ff0000';
      ctx.fillRect(e.x,e.y,e.w,3);
      ctx.font='20px Arial';
      ctx.textAlign='center';
      ctx.fillText('⚠️',e.x+e.w/2,e.y-5);
    } else if(e.tip==='platform'){
      ctx.fillStyle='#00aa44';
      ctx.fillRect(e.x,e.y,e.w,e.h);
      ctx.fillStyle='#00ff66';
      ctx.fillRect(e.x,e.y,e.w,3);
    } else {
      ctx.fillStyle=e.renk+'44';
      ctx.fillRect(e.x,e.y,e.w,e.h);
      ctx.strokeStyle=e.renk;
      ctx.lineWidth=2;
      ctx.strokeRect(e.x,e.y,e.w,e.h);
      if(e.emoji){
        ctx.font=(e.tip==='dusman'?'28px':'24px')+' Arial';
        ctx.textAlign='center';
        ctx.fillText(e.emoji,e.x+e.w/2,e.y+e.h-2);
      }
    }
  });

  // Oyuncular
  oyuncular.forEach((o,i)=>{
    if(o.canTitreme>0&&Math.floor(o.canTitreme/4)%2===0)return;
    ctx.font=(o.egil?'24px':'36px')+' Arial';
    ctx.textAlign='center';
    ctx.fillText(i===0?'🏃':'🏃',o.x+o.w/2,o.y+o.h);

    // Can barı
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(o.x,o.y-10,o.w,5);
    ctx.fillStyle=i===0?'#4488ff':'#ff4444';
    ctx.fillRect(o.x,o.y-10,o.w,5);
  });

  // HUD
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(0,0,W,30);
  ctx.fillStyle='#ffaa00';
  ctx.font='bold 14px Arial';
  ctx.textAlign='left';
  ctx.fillText('⚡ '+mesafe.toFixed(0)+'m',10,20);
  ctx.textAlign='right';
  // Can kalpleri
  for(let i=0;i<3;i++){
    ctx.fillText(i<can?'❤️':'🖤',W-10-i*22,20);
  }

  // Uyarılar
  engeller.forEach(e=>{
    if(e.x>W-100&&e.x<W){
      ctx.fillStyle='rgba(255,100,0,0.3)';
      ctx.fillRect(W-80,0,80,H);
      ctx.fillStyle='#ff4400';
      ctx.font='bold 13px Arial';
      ctx.textAlign='center';
      ctx.fillText('⚠️ ENGEL!',W-40,H/2);
    }
  });
}

function bitis(){
  oyunBitti=true;
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffaa00';
  ctx.font='bold 44px Arial';
  ctx.textAlign='center';
  ctx.fillText('OYUN BİTTİ!',W/2,H/2-40);
  ctx.fillStyle='#fff';
  ctx.font='24px Arial';
  ctx.fillText(mesafe.toFixed(0)+' metre koştun!',W/2,H/2+10);
  if(mod==='2kisi'){
    let k=oyuncular[0].skor>oyuncular[1].skor?'🔵 Oyuncu 1':'🔴 Oyuncu 2';
    ctx.fillStyle='#ffaa00';
    ctx.fillText(k+' KAZANDI!',W/2,H/2+50);
  }
  document.getElementById('yenidenBtn').style.display='inline-block';
}

baslat();
</script>
</body>
</html>
