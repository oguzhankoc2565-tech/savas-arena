<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Mini Minecraft</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000;overflow:hidden;font-family:Arial,sans-serif;}
    #cvs{display:block;}
    #ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;}
    #nişan{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;text-shadow:1px 1px 2px #000;}
    #bilgi{position:absolute;top:10px;left:10px;color:#fff;font-size:13px;text-shadow:1px 1px 2px #000;line-height:1.8;}
    #can{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:4px;}
    .kalp{font-size:20px;}
    #envanter{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;}
    .slot{width:50px;height:50px;background:rgba(0,0,0,0.6);border:2px solid #888;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;}
    .slot.aktif{border-color:#fff;}
    #mesaj{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:20px 40px;border-radius:12px;font-size:18px;text-align:center;display:none;}
    #mesaj button{margin-top:12px;padding:8px 24px;background:#4a4;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;pointer-events:all;}
    #tiklaBasi{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:22px;cursor:pointer;}
    #tiklaBasi h2{font-size:36px;color:#4f4;margin-bottom:12px;}
    #tiklaBasi p{font-size:14px;color:#aaa;margin-top:8px;}
    #gunDurum{position:absolute;top:10px;right:10px;color:#fff;font-size:13px;text-shadow:1px 1px 2px #000;}
  </style>
</head>
<body>
<canvas id="cvs"></canvas>
<div id="ui">
  <div id="nişan">+</div>
  <div id="bilgi">
    <div>⛏️ <span id="blokAd">Toprak</span></div>
    <div>📍 X:<span id="px">0</span> Y:<span id="py">0</span> Z:<span id="pz">0</span></div>
    <div>🧟 Zombi: <span id="zombiSay">0</span></div>
  </div>
  <div id="gunDurum">🌞 <span id="gunEl">Gündüz</span></div>
  <div id="can"></div>
  <div id="envanter">
    <div class="slot aktif" id="slot0">🟫</div>
    <div class="slot" id="slot1">⬜</div>
    <div class="slot" id="slot2">🟩</div>
    <div class="slot" id="slot3">🪵</div>
    <div class="slot" id="slot4">🟧</div>
    <div class="slot" id="slot5">💎</div>
    <div class="slot" id="slot6">🗡️</div>
    <div class="slot" id="slot7">🏹</div>
  </div>
  <div id="mesaj"></div>
  <div id="tiklaBasi">
    <h2>🧱 MİNİ MİNECRAFT</h2>
    <p>Oynamak için tıkla</p>
    <p style="margin-top:16px;font-size:13px;">
      WASD: Hareket | SPACE: Zıpla | Fare: Bak<br>
      Sol Tık: Blok Kır | Sağ Tık: Blok Koy<br>
      1-8: Blok Seç | E: Envanter | F: Saldır
    </p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// === SAHNE KURULUM ===
const cvs = document.getElementById('cvs');
cvs.width = window.innerWidth;
cvs.height = window.innerHeight;

const renderer = new THREE.WebGLRenderer({canvas: cvs, antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87ceeb, 0.02);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(8, 20, 8);

window.addEventListener('resize', ()=>{
  cvs.width = window.innerWidth; cvs.height = window.innerHeight;
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// === IŞIK ===
const ambLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambLight);
const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(50, 100, 50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
scene.add(sunLight);

// === BLOK TİPLERİ ===
const BLOKLAR = {
  toprak: { renk: 0x8B4513, emoji: '🟫', sertlik: 1 },
  tas:    { renk: 0x888888, emoji: '⬜', sertlik: 2 },
  cimen:  { renk: 0x228B22, emoji: '🟩', sertlik: 1 },
  agac:   { renk: 0x8B6914, emoji: '🪵', sertlik: 1 },
  turuncu:{ renk: 0xFF6600, emoji: '🟧', sertlik: 1 },
  elmas:  { renk: 0x00FFFF, emoji: '💎', sertlik: 3 },
  kum:    { renk: 0xF4D03F, emoji: '🟨', sertlik: 1 },
  kar:    { renk: 0xFFFFFF, emoji: '⬜', sertlik: 1 }
};

const blokSirasi = ['toprak','tas','cimen','agac','turuncu','elmas'];
let seciliSlot = 0;

// === DÜNYA ===
const blokMesh = new Map();
const blokData = new Map();

function blokKey(x,y,z){ return `${x},${y},${z}`; }

function blokMat(tip){
  return new THREE.MeshLambertMaterial({color: BLOKLAR[tip].renk});
}

const blokGeo = new THREE.BoxGeometry(1,1,1);

function blokEkle(x,y,z,tip){
  let key = blokKey(x,y,z);
  if(blokMesh.has(key)) return;
  let mat = blokMat(tip);
  // Kenar çizgisi
  let mesh = new THREE.Mesh(blokGeo, mat);
  mesh.position.set(x+0.5, y+0.5, z+0.5);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  blokMesh.set(key, mesh);
  blokData.set(key, {tip, sertlik: BLOKLAR[tip].sertlik});

  // Kenar
  let edges = new THREE.EdgesGeometry(blokGeo);
  let line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x000000, transparent:true, opacity:0.3}));
  line.position.copy(mesh.position);
  scene.add(line);
}

function blokSil(x,y,z){
  let key = blokKey(x,y,z);
  let mesh = blokMesh.get(key);
  if(mesh){ scene.remove(mesh); blokMesh.delete(key); blokData.delete(key); }
}

function blokVar(x,y,z){
  return blokData.has(blokKey(Math.floor(x),Math.floor(y),Math.floor(z)));
}

// === DÜNYA OLUŞTUR ===
function dunyaOlustur(){
  let W=20, D=20;
  for(let x=0;x<W;x++){
    for(let z=0;z<D;z++){
      // Temel zemin
      let yukseklik = Math.floor(Math.sin(x*0.4)*2 + Math.cos(z*0.3)*2 + 5);
      // Çimen üst katman
      blokEkle(x, yukseklik, z, 'cimen');
      // Toprak orta
      for(let y=yukseklik-1; y>=yukseklik-3; y--) blokEkle(x,y,z,'toprak');
      // Taş alt
      for(let y=yukseklik-4; y>=0; y--) blokEkle(x,y,z,'tas');

      // Rastgele ağaçlar
      if(Math.random()<0.05 && x>1 && x<W-1 && z>1 && z<D-1){
        let ay = yukseklik+1;
        for(let i=0;i<4;i++) blokEkle(x,ay+i,z,'agac');
        // Yapraklar
        for(let lx=-2;lx<=2;lx++) for(let lz=-2;lz<=2;lz++) for(let ly=0;ly<2;ly++){
          if(Math.abs(lx)+Math.abs(lz)+Math.abs(ly)<4) blokEkle(x+lx,ay+3+ly,z+lz,'cimen');
        }
      }

      // Rastgele elmas (derin)
      if(Math.random()<0.02) blokEkle(x,1,z,'elmas');
    }
  }
}

dunyaOlustur();

// === OYUNCU ===
const oyuncu = {
  pos: new THREE.Vector3(10, 12, 10),
  vel: new THREE.Vector3(),
  yerde: false,
  can: 10,
  maxCan: 10,
  pitch: 0,
  yaw: 0,
  hiz: 0.12,
  zipsGuc: 0.3,
  saldiriZamani: 0
};

camera.position.copy(oyuncu.pos);

// === FARE KONTROLÜ ===
let fareKilitli = false;
document.getElementById('tiklaBasi').addEventListener('click', ()=>{
  cvs.requestPointerLock();
});

document.addEventListener('pointerlockchange', ()=>{
  fareKilitli = document.pointerLockElement === cvs;
  document.getElementById('tiklaBasi').style.display = fareKilitli ? 'none' : 'flex';
});

document.addEventListener('mousemove', e=>{
  if(!fareKilitli) return;
  oyuncu.yaw   -= e.movementX * 0.002;
  oyuncu.pitch -= e.movementY * 0.002;
  oyuncu.pitch  = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, oyuncu.pitch));
});

// === KLAVYE ===
const tuslar = {};
document.addEventListener('keydown', e=>{ tuslar[e.code]=true;
  if(e.code==='Space'){ e.preventDefault(); if(oyuncu.yerde){ oyuncu.vel.y=oyuncu.zipsGuc; oyuncu.yerde=false; }}
  if(e.code==='KeyF') saldir();
  // Slot seçimi
  for(let i=1;i<=8;i++) if(e.code===`Digit${i}`){ slotSec(i-1); }
});
document.addEventListener('keyup',  e=>{ tuslar[e.code]=false; });

function slotSec(i){
  document.getElementById(`slot${seciliSlot}`).classList.remove('aktif');
  seciliSlot = i;
  document.getElementById(`slot${seciliSlot}`).classList.add('aktif');
  let tip = blokSirasi[seciliSlot] || 'toprak';
  document.getElementById('blokAd').textContent = tip.charAt(0).toUpperCase()+tip.slice(1);
}

// === RAYCASTER (Blok seçimi) ===
const raycaster = new THREE.Raycaster();
const merkez = new THREE.Vector2(0,0);

function hedefBlokBul(){
  raycaster.setFromCamera(merkez, camera);
  let meshler = [...blokMesh.values()];
  let kesisimler = raycaster.intersectObjects(meshler);
  if(kesisimler.length>0 && kesisimler[0].distance<6){
    return kesisimler[0];
  }
  return null;
}

// Blok kır
document.addEventListener('mousedown', e=>{
  if(!fareKilitli) return;
  let hit = hedefBlokBul();
  if(!hit) return;
  let p = hit.object.position;
  let x=Math.floor(p.x), y=Math.floor(p.y), z=Math.floor(p.z);

  if(e.button===0){
    // Sol tık - kır
    blokSil(x,y,z);
    parcacikEfekti(p.x, p.y, p.z);
  } else if(e.button===2){
    // Sağ tık - yerleştir
    let n = hit.face.normal;
    let nx=x+Math.round(n.x), ny=y+Math.round(n.y), nz=z+Math.round(n.z);
    // Oyuncuyla çakışma kontrolü
    let op = oyuncu.pos;
    if(!(nx===Math.floor(op.x) && nz===Math.floor(op.z) && (ny===Math.floor(op.y) || ny===Math.floor(op.y)-1))){
      let tip = blokSirasi[seciliSlot] || 'toprak';
      blokEkle(nx, ny, nz, tip);
    }
  }
});

document.addEventListener('contextmenu', e=>e.preventDefault());

// === PARÇACİK EFEKTİ ===
const parcaciklar = [];
function parcacikEfekti(x,y,z){
  for(let i=0;i<8;i++){
    let geo = new THREE.BoxGeometry(0.15,0.15,0.15);
    let mat = new THREE.MeshBasicMaterial({color: Math.random()*0xffffff});
    let p = new THREE.Mesh(geo, mat);
    p.position.set(x,y,z);
    p.vel = new THREE.Vector3((Math.random()-0.5)*0.2,(Math.random()*0.2),(Math.random()-0.5)*0.2);
    p.life = 30;
    scene.add(p);
    parcaciklar.push(p);
  }
}

// === ZOMBİLER ===
const zombiler = [];
const zombiGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);

function zombiOlustur(){
  let mat = new THREE.MeshLambertMaterial({color: 0x2d5a1b});
  let z = new THREE.Mesh(zombiGeo, mat);
  // Rastgele konum
  let x = Math.random()*18+1, zz = Math.random()*18+1;
  let y = 15;
  z.position.set(x, y, zz);
  z.castShadow = true;
  scene.add(z);

  // Gözler
  let gozGeo = new THREE.BoxGeometry(0.2,0.2,0.1);
  let gozMat = new THREE.MeshBasicMaterial({color:0xff0000});
  let goz1 = new THREE.Mesh(gozGeo,gozMat);
  let goz2 = new THREE.Mesh(gozGeo,gozMat);
  goz1.position.set(-0.2,0.5,0.45);
  goz2.position.set(0.2,0.5,0.45);
  z.add(goz1); z.add(goz2);

  zombiler.push({mesh:z, can:5, hiz:0.03, saldiriZamani:0, vel:new THREE.Vector3()});
  document.getElementById('zombiSay').textContent = zombiler.length;
}

// Her 8 saniyede zombi üret
setInterval(()=>{ if(zombiler.length<8) zombiOlustur(); }, 8000);
// İlk zombiler
setTimeout(()=>zombiOlustur(), 2000);
setTimeout(()=>zombiOlustur(), 5000);

function saldir(){
  oyuncu.saldiriZamani = Date.now();
  zombiler.forEach((z,i)=>{
    let d = z.mesh.position.distanceTo(oyuncu.pos);
    if(d<3){
      z.can--;
      if(z.can<=0){
        scene.remove(z.mesh);
        zombiler.splice(i,1);
        document.getElementById('zombiSay').textContent=zombiler.length;
        parcacikEfekti(z.mesh.position.x,z.mesh.position.y,z.mesh.position.z);
      }
    }
  });
}

// === CAN BAR ===
function canGuncelle(){
  let canDiv = document.getElementById('can');
  canDiv.innerHTML = '';
  for(let i=0;i<oyuncu.maxCan;i++){
    let k = document.createElement('span');
    k.className='kalp';
    k.textContent = i<oyuncu.can ? '❤️' : '🖤';
    canDiv.appendChild(k);
  }
}
canGuncelle();

// === GÜN/GECE DÖNGÜSÜ ===
let gunZamani = 0;
let gece = false;

// === ÇARPIŞMA ===
function yerdeMi(pos){
  let x=Math.floor(pos.x), z=Math.floor(pos.z);
  let y=Math.floor(pos.y-0.1);
  return blokVar(x,y,z) || blokVar(x-1,y,z) || blokVar(x,y,z-1) || blokVar(x-1,y,z-1);
}

function duvardaMi(pos){
  let x=Math.floor(pos.x), z=Math.floor(pos.z), y=Math.floor(pos.y);
  return blokVar(x,y,z) || blokVar(x,y+1,z);
}

// === ANA DÖNGÜ ===
const saat = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  let dt = saat.getDelta();

  if(fareKilitli){
    // Kamera yönü
    let dir = new THREE.Vector3();
    dir.x = Math.sin(oyuncu.yaw)*Math.cos(oyuncu.pitch);
    dir.y = Math.sin(oyuncu.pitch);
    dir.z = Math.cos(oyuncu.yaw)*Math.cos(oyuncu.pitch);
    camera.rotation.set(oyuncu.pitch, oyuncu.yaw, 0, 'YXZ');

    // Hareket
    let ileri = new THREE.Vector3(-Math.sin(oyuncu.yaw), 0, -Math.cos(oyuncu.yaw));
    let yan   = new THREE.Vector3(Math.cos(oyuncu.yaw), 0, -Math.sin(oyuncu.yaw));
    let hVel  = new THREE.Vector3();

    if(tuslar['KeyW']) hVel.add(ileri);
    if(tuslar['KeyS']) hVel.sub(ileri);
    if(tuslar['KeyA']) hVel.sub(yan);
    if(tuslar['KeyD']) hVel.add(yan);

    if(hVel.length()>0) hVel.normalize().multiplyScalar(oyuncu.hiz*(oyuncu.yerde?1:0.7));

    // Yerçekimi
    oyuncu.vel.y -= 0.018;
    oyuncu.vel.y = Math.max(oyuncu.vel.y, -0.5);

    // Pozisyon güncelle
    let yeniPos = oyuncu.pos.clone();
    yeniPos.x += hVel.x + oyuncu.vel.x;
    yeniPos.z += hVel.z + oyuncu.vel.z;

    // Duvar çarpışma
    if(duvardaMi(yeniPos)){
      yeniPos.x = oyuncu.pos.x;
      yeniPos.z = oyuncu.pos.z;
    }

    yeniPos.y += oyuncu.vel.y;

    // Zemin çarpışma
    if(yerdeMi(yeniPos)){
      if(oyuncu.vel.y<0){ oyuncu.vel.y=0; oyuncu.yerde=true; }
      while(yerdeMi(yeniPos)) yeniPos.y+=0.05;
    } else {
      oyuncu.yerde = false;
    }

    // Düşme ölümü
    if(yeniPos.y < -5){ yeniPos.set(10,15,10); oyuncu.vel.set(0,0,0); oyuncu.can--; canGuncelle(); }

    oyuncu.pos.copy(yeniPos);
    oyuncu.vel.x *= 0.8;
    oyuncu.vel.z *= 0.8;
    camera.position.copy(oyuncu.pos);
    camera.position.y += 0.8; // Göz yüksekliği

    // Pozisyon bilgisi
    document.getElementById('px').textContent = Math.floor(oyuncu.pos.x);
    document.getElementById('py').textContent = Math.floor(oyuncu.pos.y);
    document.getElementById('pz').textContent = Math.floor(oyuncu.pos.z);

    // Zombi AI
    zombiler.forEach((z,i)=>{
      let dir = new THREE.Vector3().subVectors(oyuncu.pos, z.mesh.position).normalize();
      dir.y = 0;
      z.mesh.position.x += dir.x * z.hiz;
      z.mesh.position.z += dir.z * z.hiz;

      // Zombi yerçekimi
      z.vel.y -= 0.015;
      z.mesh.position.y += z.vel.y;
      let zy = Math.floor(z.mesh.position.y-0.1);
      let zx = Math.floor(z.mesh.position.x);
      let zz2 = Math.floor(z.mesh.position.z);
      if(blokVar(zx,zy,zz2)){ z.vel.y=0; while(blokVar(zx,Math.floor(z.mesh.position.y-0.1),zz2)) z.mesh.position.y+=0.05; }
      if(z.mesh.position.y<-5){ scene.remove(z.mesh); zombiler.splice(i,1); document.getElementById('zombiSay').textContent=zombiler.length; return; }

      // Zombi yönü
      z.mesh.lookAt(oyuncu.pos.x, z.mesh.position.y, oyuncu.pos.z);

      // Oyuncuya saldırı
      let uzak = z.mesh.position.distanceTo(oyuncu.pos);
      if(uzak<1.5 && Date.now()-z.saldiriZamani>1500){
        z.saldiriZamani = Date.now();
        oyuncu.can = Math.max(0,oyuncu.can-1);
        canGuncelle();
        if(oyuncu.can<=0) olum();
      }
    });

    // Parçacıklar
    for(let i=parcaciklar.length-1;i>=0;i--){
      let p=parcaciklar[i];
      p.position.add(p.vel);
      p.vel.y-=0.01;
      p.life--;
      if(p.life<=0){ scene.remove(p); parcaciklar.splice(i,1); }
    }

    // Gün/Gece döngüsü
    gunZamani += dt*0.02;
    let gunAci = Math.sin(gunZamani);
    if(gunAci>0){
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog.color.set(0x87ceeb);
      ambLight.intensity = 0.3+gunAci*0.5;
      sunLight.intensity = gunAci;
      gece=false;
      document.getElementById('gunEl').textContent='Gündüz ☀️';
    } else {
      scene.background = new THREE.Color(0x001133);
      scene.fog.color.set(0x001133);
      ambLight.intensity = 0.1;
      sunLight.intensity = 0;
      gece=true;
      document.getElementById('gunEl').textContent='Gece 🌙';
      // Geceleyin zombiler hızlanır
      zombiler.forEach(z=>z.hiz=0.05);
    }
    sunLight.position.set(Math.cos(gunZamani)*100, Math.sin(gunZamani)*100, 50);
  }

  renderer.render(scene, camera);
}

function olum(){
  let m = document.getElementById('mesaj');
  m.style.display='block';
  m.innerHTML='<p>💀 Öldün!</p><button onclick="yenidenBasla()">Yeniden Başla</button>';
  document.exitPointerLock();
}

function yenidenBasla(){
  oyuncu.pos.set(10,15,10);
  oyuncu.vel.set(0,0,0);
  oyuncu.can=oyuncu.maxCan;
  canGuncelle();
  document.getElementById('mesaj').style.display='none';
}

scene.background = new THREE.Color(0x87ceeb);
animate();
</script>
</body>
</html>
